<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>33 Gold Collection · Gökmen Çevikbaş</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.gx-title{margin:0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:196px;line-height:.82;letter-spacing:.02em;text-align:center;background:linear-gradient(100deg,#8C6A2F 0%,#E9C77C 22%,#FFF0C2 30%,#C9A45C 40%,#8C6A2F 60%,#E9C77C 80%,#C9A45C 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gx-shine 7s ease-in-out infinite}
.gx-kit{position:relative;margin:0;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 1px rgba(214,175,96,.18);animation:gx-rise 1s cubic-bezier(.2,.7,.2,1) both}
.gx-kit img{display:block;height:596px;width:auto;animation:gx-float 9s ease-in-out infinite}
.gx-kit::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,232,170,.26) 50%,transparent 62%);transform:translateX(-130%);animation:gx-sheen 6.5s ease-in-out infinite}
.gx-k2{animation-delay:.12s}.gx-k2::after{animation-delay:2.1s}.gx-k2 img{animation-delay:-3s}
.gx-k3{animation-delay:.24s}.gx-k3::after{animation-delay:4.2s}.gx-k3 img{animation-delay:-6s}
.gx-cap{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#A89B83}
.gx-cap b{color:#E9C77C;font-weight:500}
.gx-dust{position:absolute;left:0;right:0;top:-100%;height:200%;pointer-events:none;z-index:-1;background-image:radial-gradient(circle at 12% 18%,rgba(214,175,96,.8) 0 1.4px,transparent 2.4px),radial-gradient(circle at 38% 72%,rgba(214,175,96,.55) 0 1px,transparent 2px),radial-gradient(circle at 64% 34%,rgba(214,175,96,.75) 0 1.8px,transparent 2.8px),radial-gradient(circle at 82% 82%,rgba(214,175,96,.5) 0 1.1px,transparent 2.1px),radial-gradient(circle at 91% 11%,rgba(214,175,96,.7) 0 1px,transparent 2px);background-size:460px 509px;animation:gx-fall 34s linear infinite}
@keyframes gx-shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
@keyframes gx-rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes gx-float{0%,100%{transform:scale(1.01) translateY(0)}50%{transform:scale(1.04) translateY(-6px)}}
@keyframes gx-sheen{0%,55%{transform:translateX(-130%)}85%,100%{transform:translateX(130%)}}
@keyframes gx-fall{from{transform:translateY(0)}to{transform:translateY(50%)}}
@media (prefers-reduced-motion: reduce){.gx-title,.gx-kit,.gx-kit img,.gx-kit::after,.gx-dust{animation:none}}
</style>
<link rel="stylesheet" href="page.css">
</head>
<body>
<div class="board">
<div style="width: 1440px; height: 1018px; box-sizing: border-box; padding: 52px 80px 44px; background: radial-gradient(ellipse 60% 55% at 50% 62%, #241C10 0%, #0B0A08 70%); color: #F4EFE6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative; isolation: isolate">
  <div class="gx-dust" aria-hidden="true"></div>
  <header style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #A89B83; padding-bottom: 18px; border-bottom: 1px solid #2E281E">
    <span>02 — Marka Kimliği · Forma tasarımı</span>
    <span>33</span>
  </header>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 26px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #A89B83">
    <span>Sezon 2024 — 2025</span>
    <span style="color: #E9C77C">Galatasaray × Puma · Konsept</span>
    <span>Forma · Mockup · Lansman</span>
  </div>
  <h1 class="gx-title" lang="en" style="margin-top: 14px">GOLD COLLECTION</h1>
  <div style="flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-end; gap: 22px; margin-top: 22px">
    <div style="display: flex; flex-direction: column">
      <figure class="gx-kit"><img src="../assets/19020bada6b177f833c9882fbc79f0aa.jpg" alt="Siyah iç saha forması, altın yaka ve kol bantları"></figure>
      <div class="gx-cap"><span><b>01</b> İç saha</span><span>Siyah · Altın</span></div>
    </div>
    <div style="display: flex; flex-direction: column">
      <figure class="gx-kit gx-k2"><img src="../assets/a4128606f2449a8bca93f0e3474ad61d.jpg" alt="Beyaz deplasman forması önden"></figure>
      <div class="gx-cap"><span><b>02</b> Deplasman</span><span>Beyaz · Altın</span></div>
    </div>
    <div style="display: flex; flex-direction: column">
      <figure class="gx-kit gx-k3"><img src="../assets/15e7457d01c1229ac6573c24889a1197.jpg" alt="Beyaz deplasman forması, Avrupa kupası arması ve desenli gövde"></figure>
      <div class="gx-cap"><span><b>03</b> Avrupa</span><span>Desen detayı</span></div>
    </div>
  </div>
</div>
</div>
<script src="page.js"></script>
</body>
</html>
