<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 Kapak · Gökmen Çevikbaş</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
@keyframes cv-rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes cv-in{from{opacity:0;transform:scale(.86) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes cv-orbit{to{transform:rotate(360deg)}}
@keyframes cv-up{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes cv-down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
@keyframes cv-line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cv-rise{animation:cv-rise .9s cubic-bezier(.2,.7,.2,1) both}
.cv-d1{animation-delay:.12s}.cv-d2{animation-delay:.24s}.cv-d3{animation-delay:.36s}.cv-d4{animation-delay:.5s}
.cv-mark{position:relative;width:132px;height:132px}
.cv-mark img{position:absolute;inset:14px;width:104px;height:104px;animation:cv-in 1.1s cubic-bezier(.2,.7,.2,1) both}
.cv-mark svg{position:absolute;inset:0;animation:cv-orbit 24s linear infinite}
.cv-col{display:flex;flex-direction:column;gap:12px;padding-bottom:12px;animation:cv-up 46s linear infinite}
.cv-col.cv-rev{animation-name:cv-down;animation-duration:54s}
.cv-col.cv-slow{animation-duration:62s}
.cv-card{margin:0;aspect-ratio:3 / 4;border-radius:12px;overflow:hidden;background:#1A1C22;flex-shrink:0}
.cv-card img{width:100%;height:100%;object-fit:cover;display:block}
.cv-stat{border-top:1px solid #2A2E37;padding-top:18px;display:flex;flex-direction:column;gap:6px;transform-origin:left}
.cv-rule{height:1px;background:#2A2E37;transform-origin:left;animation:cv-line 1s .4s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.cv-rise,.cv-mark img,.cv-mark svg,.cv-col,.cv-rule{animation:none}}
</style>
<link rel="stylesheet" href="page.css">
</head>
<body>
<div class="board">
<div style="width: 1440px; height: 1018px; box-sizing: border-box; background: #0E0F12; color: #F4F4F6; font-family: Inter, system-ui, sans-serif; display: flex; overflow: hidden">
  <section style="flex: 1; min-width: 0; padding: 56px 64px 52px 80px; display: flex; flex-direction: column; justify-content: space-between">
    <div class="cv-rise" style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #8B909C">
      <span>Portfolyo · 2023 — 2026</span>
      <span>Grafik Tasarım</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 36px">

        <svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="64" fill="none" stroke="#FFC72C" stroke-width="1.5" stroke-dasharray="3 9" stroke-linecap="round"></circle><circle cx="66" cy="2" r="4" fill="#FFC72C"></circle></svg>

      <h1 class="cv-rise cv-d1" style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 124px; line-height: 0.9; letter-spacing: -0.05em">Gökmen<br>Çevikbaş<span style="color: #FFC72C">.</span></h1>
      <p class="cv-rise cv-d2" style="margin: 0; max-width: 600px; font-size: 21px; line-height: 1.5; color: #C9CDD6">Grafik tasarımcı. Mobil uygulama arayüzleri, performans odaklı reklam kreatifleri, marka kimlikleri ve AI destekli video işleri tasarlıyorum.</p>
    </div>

      <div class="cv-stat"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FFC72C">02</span><span style="font-family: 'Inter Tight', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15">Marka Kimliği</span></div>
